# Site: https://freevoiceconvert.pages.dev on Cloudflare Pages. Runs when site/ changes, after every successful
# "Build apps" (which makes or updates release v<N>), or by hand. The newest release's .dmg and .exe are put next to the
# page under fixed names (download/FreeVoiceConvert.dmg, download/FreeVoiceConvert-Setup.exe), and its tag is the version
# written on the page, so the page offers each new version by itself. Secrets (repository settings): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Site
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_run:
    workflows: [Build apps]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The newest release behind the fixed addresses (download/FreeVoiceConvert.dmg, -Setup.exe)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The page's buttons never carry a version (MANTRA_MANIFEST modules/download-always-latest.md): the newest
          # release's files are copied here under fixed names, and the version on the page is that release's tag.
          set -euo pipefail
          TAG=$(gh release view --json tagName --jq .tagName)
          V=${TAG#v}
          echo "newest release: $TAG"
          rm -rf rel site/public/download && mkdir -p rel site/public/download
          gh release download "$TAG" --pattern '*.dmg' --pattern '*-Setup.exe' -D rel
          ls -l rel
          [ "$(ls rel/*.dmg | wc -l)" = 1 ] && [ "$(ls rel/*-Setup.exe | wc -l)" = 1 ] || { echo "::error::$TAG needs one .dmg and one -Setup.exe"; exit 1; }
          cp rel/*.dmg site/public/download/FreeVoiceConvert.dmg
          cp rel/*-Setup.exe site/public/download/FreeVoiceConvert-Setup.exe
          for f in site/public/download/*; do
            [ "$(stat -c %s "$f")" -le 26214400 ] || { echo "::error::$f is over Cloudflare Pages' 25 MB"; exit 1; }
          done
          ls -l site/public/download
          sed -i "s/__VERSION__/$V/g" site/public/index.html
          ! grep -n '__VERSION__' site/public/index.html
      - name: The Pages project (made the first time, then it already exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create freevoiceconvert --production-branch main || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/public --project-name=freevoiceconvert --branch=main --commit-dirty=true
